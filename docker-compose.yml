services:
  postgres:
    image: postgres:15-alpine
    container_name: gfcri_postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gfcri_db}
      POSTGRES_USER: ${POSTGRES_USER:-gfcri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gfcri}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gfcri_app
    command: python -m src.main
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./src:/app/src
      - shared_output:/app/output
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: gfcri_api
    command: >
      sh -c "python -c 'import fastapi, uvicorn, pydantic, multipart, waffo, cryptography, authlib' >/dev/null 2>&1 || pip install --no-cache-dir 'fastapi>=0.115' 'uvicorn[standard]>=0.30' 'pydantic>=2.7' 'python-multipart>=0.0.9' 'waffo==0.4.0b0' 'cryptography>=42' 'authlib>=1.3' -i https://pypi.tuna.tsinghua.edu.cn/simple; exec uvicorn api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      OUTPUT_DIR: /app/output
    volumes:
      - ./api:/app/api
      - ./src:/app/src
      - shared_output:/app/output
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: gfcri_frontend
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    volumes:
      - /opt/gfcri/certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
  dashboard:
    build: .
    container_name: gfcri_dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./dashboard:/app/dashboard
      - shared_output:/app/output

volumes:
  postgres_data:
  shared_output:
