services:
  postgres:
    image: postgres:15-alpine
    container_name: gfcri_postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gfcri_db}
      POSTGRES_USER: ${POSTGRES_USER:-gfcri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gfcri}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gfcri_app
    command: python -m src.main
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./src:/app/src
      - shared_output:/app/output
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: gfcri_api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      OUTPUT_DIR: /app/output
    volumes:
      - ./api:/app/api
      - ./src:/app/src
      - shared_output:/app/output
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: gfcri_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  dashboard:
    build: .
    container_name: gfcri_dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./dashboard:/app/dashboard
      - shared_output:/app/output

volumes:
  postgres_data:
  shared_output:
