limit_req_zone $binary_remote_addr zone=gfcri_api_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=gfcri_api_conn:10m;

server {
    listen 80;
    server_name gfcrilabs.com www.gfcrilabs.com _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gfcrilabs.com www.gfcrilabs.com;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/gfcrilabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gfcrilabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    error_page 429 = @rate_limited;

    location /api/ {
        limit_req zone=gfcri_api_rate burst=20 nodelay;
        limit_req_status 429;
        limit_conn gfcri_api_conn 20;
        limit_conn_status 429;
        set $gfcri_api_upstream http://api:8000;
        proxy_pass $gfcri_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After "1" always;
        add_header X-Request-ID $request_id always;
        return 429 '{"code":"RATE_LIMITED","message":"Too many requests. Please retry shortly.","retry_after_seconds":1,"request_id":"$request_id"}';
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
    location / {
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files /index.html =404;
    }

        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
